name: husie
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-husie}
      POSTGRES_USER: ${POSTGRES_USER:-husie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - husie_pg:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-husie}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-husie}
      MEDIA_ROOT: /data/husie
      SESSION_DAYS: ${SESSION_DAYS:-30}
      CORS_ORIGIN: https://${HUSIE_DOMAIN:?Set HUSIE_DOMAIN in .env}
    expose:
      - "4000"
    volumes:
      - ./storage:/data/husie
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
  worker:
    build: ./apps/api
    restart: unless-stopped
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-husie}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-husie}
      MEDIA_ROOT: /data/husie
      FFMPEG_BIN: ffmpeg
    volumes:
      - ./storage:/data/husie
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        MIRROR_GRAM_API_URL: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MIRROR_GRAM_API_URL: http://api:4000
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HUSIE_DOMAIN: ${HUSIE_DOMAIN:?Set HUSIE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - husie_caddy_data:/data
      - husie_caddy_config:/config
    depends_on:
      - web
volumes:
  husie_pg:
  husie_caddy_data:
  husie_caddy_config:
