name: Prepare Husie source for testing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract prepared Husie ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Husie_Free_Testing_Prep.zip"
          test -f "$ARCHIVE" || { echo "Missing $ARCHIVE in repository root"; exit 1; }
          mkdir -p /tmp/husie-unpack
          unzip -q "$ARCHIVE" -d /tmp/husie-unpack
          SRC="/tmp/husie-unpack/Husie_Independent_Final_v7"
          test -f "$SRC/package.json"
          test -d "$SRC/apps/web"
          test -d "$SRC/apps/api"
          rsync -a --exclude='.git/' --exclude='*.zip' --exclude='.github/workflows/' "$SRC/" ./
          echo "Project files copied into repository root."
      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Prepare Husie source for free testing"
            git push
          fi
