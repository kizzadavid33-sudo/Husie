name: Husie Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_HUSIE_WEB_URL: ${{ vars.HUSIE_WEB_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require hosted Husie URL
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_HUSIE_WEB_URL}" ]; then
            echo "::error::Set repository variable HUSIE_WEB_URL to the public HTTPS URL of the running Husie website before building the APK."
            exit 1
          fi
          case "$EXPO_PUBLIC_HUSIE_WEB_URL" in
            https://*) ;;
            *) echo "::error::HUSIE_WEB_URL must start with https://"; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: husie-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
