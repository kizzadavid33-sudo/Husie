name: Prepare Husie source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-husie.yml"
      - "Husie_Free_Testing_Prep.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract prepared Husie source
        shell: bash
        run: |
          set -euo pipefail
          test -f Husie_Free_Testing_Prep.zip
          unzip -q Husie_Free_Testing_Prep.zip -d /tmp/husie-unpack
          SRC="/tmp/husie-unpack/Husie_Independent_Final_v7"
          test -f "$SRC/package.json"
          test -d "$SRC/apps/web"
          test -d "$SRC/apps/api"
          rsync -a --exclude='.git/' --exclude='*.zip' --exclude='.github/workflows/' "$SRC/" ./

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Extract prepared Husie source for testing"
          git pull --rebase origin main
          git push
